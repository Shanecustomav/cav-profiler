<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Custom AV — Lifestyle Profiler</title>
<meta name="description" content="A short discovery tool to shape your Custom AV design brief. Engineered for the way you live." />
<meta property="og:title" content="Custom AV — Lifestyle Profiler" />
<meta property="og:description" content="Shape your bespoke smart-home brief in 3 minutes. Engineered for the way you live." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#0A0A0A" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #0A0A0A;
    color: #F5F2EC;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }
  .cav-app {
    max-width: 680px;
    width: 100%;
    margin: 0 auto;
    color: #F5F2EC;
    background: #0A0A0A;
    border: 0.5px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    overflow: hidden;
    min-height: 600px;
  }
  .cav-header {
    background: #0A0A0A;
    padding: 36px 28px 22px;
    text-align: center;
    border-bottom: 0.5px solid rgba(255,255,255,0.08);
  }
  .cav-logo {
    display: block;
    margin: 0 auto 10px;
    max-width: 180px;
    height: auto;
  }
  @media (max-width: 480px) {
    .cav-logo { max-width: 150px; }
  }
  .cav-tag {
    font-size: 10px;
    letter-spacing: 4px;
    color: #888;
    text-transform: uppercase;
  }
  .cav-body { padding: 32px 28px; }
  .cav-progress {
    height: 2px;
    background: rgba(255,255,255,0.08);
    margin-bottom: 24px;
    border-radius: 2px;
    overflow: hidden;
  }
  .cav-progress-bar {
    height: 100%;
    background: #C0C0C0;
    transition: width 0.4s ease;
  }
  .cav-step-label {
    font-size: 11px;
    letter-spacing: 3px;
    color: #888;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .cav-question {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 26px;
    font-weight: 400;
    line-height: 1.3;
    margin-bottom: 14px;
    color: #F5F2EC;
  }
  .cav-rationale {
    font-size: 13px;
    color: #999;
    line-height: 1.7;
    margin-bottom: 22px;
    padding: 14px 16px;
    background: #141414;
    border-left: 2px solid #D4A574;
    border-radius: 0 6px 6px 0;
  }
  .cav-rationale strong {
    color: #D4A574;
    font-weight: 500;
    letter-spacing: 1px;
    font-size: 11px;
    text-transform: uppercase;
    display: block;
    margin-bottom: 6px;
  }
  .cav-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 24px;
  }
  .cav-option {
    background: #141414;
    border: 0.5px solid rgba(255,255,255,0.12);
    padding: 14px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: #F5F2EC;
    transition: all 0.2s;
    text-align: left;
    font-family: inherit;
    width: 100%;
  }
  .cav-option:hover {
    border-color: #C0C0C0;
    background: #1a1a1a;
  }
  .cav-option.selected {
    border-color: #D4A574;
    background: #1a1612;
  }
  .cav-option-meta {
    display: block;
    font-size: 11px;
    color: #888;
    margin-top: 4px;
    letter-spacing: 1px;
  }
  .cav-option.selected .cav-option-meta { color: #D4A574; }
  .cav-input {
    width: 100%;
    background: #141414;
    border: 0.5px solid rgba(255,255,255,0.12);
    padding: 14px 18px;
    border-radius: 8px;
    color: #F5F2EC;
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 10px;
  }
  .cav-input:focus {
    outline: none;
    border-color: #C0C0C0;
  }
  .cav-input::placeholder { color: #666; }
  .cav-nav {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 16px;
  }
  .cav-btn {
    padding: 13px 28px;
    border-radius: 6px;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    border: none;
  }
  .cav-btn-primary {
    background: #C0C0C0;
    color: #0A0A0A;
    font-weight: 500;
  }
  .cav-btn-primary:hover { background: #fff; }
  .cav-btn-primary:disabled {
    background: #333;
    color: #666;
    cursor: not-allowed;
  }
  .cav-btn-ghost {
    background: transparent;
    color: #888;
    border: 0.5px solid rgba(255,255,255,0.12);
  }
  .cav-btn-ghost:hover {
    color: #F5F2EC;
    border-color: #C0C0C0;
  }
  .cav-brief { padding: 8px 0; }
  .cav-brief h2 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 28px;
    font-weight: 400;
    margin: 0 0 6px;
    color: #F5F2EC;
  }
  .cav-brief h3 {
    font-size: 11px;
    letter-spacing: 3px;
    color: #D4A574;
    text-transform: uppercase;
    margin: 28px 0 12px;
    font-weight: 500;
  }
  .cav-brief p {
    font-size: 14px;
    line-height: 1.7;
    color: #C8C5BD;
    margin: 0 0 12px;
  }
  .cav-brief ul {
    margin: 0 0 12px;
    padding-left: 18px;
    color: #C8C5BD;
    font-size: 14px;
    line-height: 1.8;
  }
  .cav-brief-summary {
    font-style: italic;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 18px;
    color: #F5F2EC;
    padding: 18px 20px;
    background: #141414;
    border-left: 2px solid #D4A574;
    border-radius: 0 8px 8px 0;
    margin: 16px 0 8px;
    line-height: 1.5;
  }
  .cav-pill {
    display: inline-block;
    background: #1a1a1a;
    border: 0.5px solid rgba(255,255,255,0.12);
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 11px;
    color: #C0C0C0;
    margin: 0 6px 6px 0;
    letter-spacing: 1px;
  }
  .cav-cta {
    background: #141414;
    border: 0.5px solid #D4A574;
    padding: 20px;
    border-radius: 8px;
    margin-top: 24px;
  }
  .cav-cta h4 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 20px;
    margin: 0 0 8px;
    color: #F5F2EC;
    font-weight: 400;
  }
  .cav-cta p {
    font-size: 13px;
    color: #C8C5BD;
    margin: 0 0 14px;
  }
  .cav-footer {
    padding: 16px 28px;
    border-top: 0.5px solid rgba(255,255,255,0.08);
    text-align: center;
    font-size: 10px;
    letter-spacing: 2px;
    color: #555;
    text-transform: uppercase;
  }
  .cav-form-grid { display: grid; gap: 10px; }
  @media (min-width: 480px) {
    .cav-form-grid { grid-template-columns: 1fr 1fr; }
    .cav-form-grid .full { grid-column: 1 / -1; }
  }
  @media (max-width: 480px) {
    .cav-question { font-size: 22px; }
    .cav-body { padding: 24px 20px; }
    .cav-header { padding: 28px 20px 18px; }
  }
  @media print {
    body { background: white; color: black; padding: 0; }
    .cav-app { border: none; background: white; }
    .cav-nav, #book, #restart, #print, .cav-cta button { display: none; }
    .cav-brief h2, .cav-brief p, .cav-brief ul, .cav-brief-summary { color: black !important; }
    .cav-brief h3 { color: #8a6a3a !important; }
  }
</style>
</head>

    <div class="cav-tag">Lifestyle Profiler</div>
  </div>
  <div class="cav-body" id="cav-body"></div>
  <div class="cav-footer">Engineered for the way you live</div>
</div>

<script>
(function(){
  // ====== CONFIG — edit these to wire up integrations later ======
  var WHATSAPP_NUMBER = '971585063220';
  var FORMSPREE_ENDPOINT = '';
  // ===============================================================

  var questions = [
    { key: 'project_type', label: 'Project type', q: 'What kind of home are we designing for?', options: [
      { v: 'New build / under construction' },
      { v: 'Major renovation' },
      { v: 'Existing home — retrofit' },
      { v: 'Off-plan apartment / villa' }
    ]},
    { key: 'size', label: 'Property size', q: 'Roughly how large is the property?', options: [
      { v: 'Apartment (under 3,000 sqft)' },
      { v: 'Villa / townhouse (3,000–8,000 sqft)' },
      { v: 'Large villa (8,000–15,000 sqft)' },
      { v: 'Estate (15,000+ sqft)' }
    ]},
    { key: 'entertain', label: 'Entertaining', q: 'How do you typically entertain at home?', options: [
      { v: 'Rarely — it is a private retreat' },
      { v: 'Intimate dinners (under 10 guests)' },
      { v: 'Frequent gatherings (10–30 guests)' },
      { v: 'Large events and formal hosting' }
    ]},
    { key: 'cinema', label: 'Viewing', q: 'How important is a dedicated cinema room?', options: [
      { v: 'Essential — reference-grade theatre' },
      { v: 'Yes, but balanced with the family room' },
      { v: 'A premium media room is enough' },
      { v: 'Not a priority' }
    ]},
    { key: 'audio', label: 'Audio', q: 'How do you experience music at home?', options: [
      { v: 'Audiophile — dedicated listening room' },
      { v: 'Multi-room throughout the home' },
      { v: 'Background music in key zones' },
      { v: 'Casual — speakers where needed' }
    ]},
    { key: 'lighting', label: 'Lighting', q: 'How should lighting feel and behave?', options: [
      { v: 'Architectural — invisible, scene-driven' },
      { v: 'Designer-led — moods for time of day' },
      { v: 'Convenient — keypads and app control' },
      { v: 'Standard switching is fine' }
    ]},
    { key: 'security', label: 'Security', q: 'What is your priority for security and access?', options: [
      { v: 'Discrete, integrated, professionally monitored' },
      { v: 'Robust CCTV and access control' },
      { v: 'Smart locks and basic cameras' },
      { v: 'Already handled separately' }
    ]},
    { key: 'climate', label: 'Climate & shading', q: 'Climate, shading and air handling — how integrated?', options: [
      { v: 'Fully automated — sun, heat, occupancy' },
      { v: 'Motorised shades + smart thermostats' },
      { v: 'Smart thermostats only' },
      { v: 'Standalone systems are fine' }
    ]},
    { key: 'travel', label: 'Travel', q: 'How often are you away from the property?', options: [
      { v: 'Most of the year — second home' },
      { v: 'Frequent travel (multiple trips per month)' },
      { v: 'Occasional travel' },
      { v: 'Primarily home-based' }
    ]},
    { key: 'support', label: 'Support', q: 'What level of ongoing support do you expect?', options: [
      { v: 'Concierge — proactive, on-call, dedicated' },
      { v: 'Priority response and annual service' },
      { v: 'Standard support when needed' },
      { v: 'Self-managed where possible' }
    ]},
    {
      key: 'budget',
      label: 'Investment',
      q: 'What investment range are you working with for the AV and smart-home scope?',
      rationale: 'Bespoke integration is engineered to the architecture — not a fixed product list. Spec, partner brands, control logic, MEP coordination and multi-year support all scale with budget. A realistic range now means we design within reality, not retrofit it later. Every figure below is for the AV and automation scope only — separate from FF&E or construction.',
      options: [
        { v: 'AED 250K – 500K', meta: 'Bronze · Smart-home essentials, single zone' },
        { v: 'AED 500K – 1M', meta: 'Silver · Whole-home with media room' },
        { v: 'AED 1M – 2.5M', meta: 'Gold · Reference cinema, full integration' },
        { v: 'AED 2.5M – 5M', meta: 'Signature · Estate-grade, multi-system' },
        { v: 'AED 5M+', meta: 'Bespoke · Trophy property, no compromises' },
        { v: 'Not sure yet — guide me', meta: 'We will frame typical investment by scope on the call' }
      ]
    }
  ];

  var state = { step: 0, answers: {}, contact: {} };
  var body = document.getElementById('cav-body');

  function render() {
    if (state.step < questions.length) renderQuestion();
    else if (state.step === questions.length) renderContact();
    else renderBrief();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function progress() {
    var total = questions.length + 1;
    var pct = Math.min(100, Math.round((state.step / total) * 100));
    return '<div class="cav-progress"><div class="cav-progress-bar" style="width:' + pct + '%"></div></div>';
  }

  function renderQuestion() {
    var q = questions[state.step];
    var selected = state.answers[q.key];
    body.innerHTML =
      progress() +
      '<div class="cav-step-label">Step ' + (state.step + 1) + ' of ' + (questions.length + 1) + ' — ' + q.label + '</div>' +
      '<div class="cav-question">' + q.q + '</div>' +
      (q.rationale ? '<div class="cav-rationale"><strong>Why we ask</strong>' + q.rationale + '</div>' : '') +
      '<div class="cav-options">' +
        q.options.map(function(opt, i) {
          return '<button class="cav-option ' + (selected === opt.v ? 'selected' : '') + '" data-opt="' + i + '">' +
            opt.v +
            (opt.meta ? '<span class="cav-option-meta">' + opt.meta + '</span>' : '') +
          '</button>';
        }).join('') +
      '</div>' +
      '<div class="cav-nav">' +
        '<button class="cav-btn cav-btn-ghost" id="back" ' + (state.step === 0 ? 'style="visibility:hidden"' : '') + '>Back</button>' +
        '<button class="cav-btn cav-btn-primary" id="next" ' + (!selected ? 'disabled' : '') + '>Continue</button>' +
      '</div>';

    body.querySelectorAll('.cav-option').forEach(function(b) {
      b.onclick = function() {
        state.answers[q.key] = q.options[parseInt(b.dataset.opt)].v;
        render();
      };
    });
    document.getElementById('back').onclick = function() { state.step--; render(); };
    document.getElementById('next').onclick = function() { if (state.answers[q.key]) { state.step++; render(); } };
  }

  function renderContact() {
    body.innerHTML =
      progress() +
      '<div class="cav-step-label">Final step — Your details</div>' +
      '<div class="cav-question">Where should we send your Lifestyle Brief?</div>' +
      '<div class="cav-form-grid">' +
        '<input class="cav-input" id="fname" placeholder="First name" value="' + (state.contact.fname||'') + '" />' +
        '<input class="cav-input" id="lname" placeholder="Last name" value="' + (state.contact.lname||'') + '" />' +
        '<input class="cav-input full" id="email" type="email" placeholder="Email address" value="' + (state.contact.email||'') + '" />' +
        '<input class="cav-input full" id="phone" placeholder="Mobile (incl. country code)" value="' + (state.contact.phone||'') + '" />' +
        '<input class="cav-input full" id="location" placeholder="Project location (e.g. Emirates Hills, Palm Jumeirah)" value="' + (state.contact.location||'') + '" />' +
      '</div>' +
      '<div class="cav-nav">' +
        '<button class="cav-btn cav-btn-ghost" id="back">Back</button>' +
        '<button class="cav-btn cav-btn-primary" id="next">Generate brief</button>' +
      '</div>';

    document.getElementById('back').onclick = function() { state.step--; render(); };
    document.getElementById('next').onclick = function() {
      ['fname','lname','email','phone','location'].forEach(function(id) {
        state.contact[id] = document.getElementById(id).value.trim();
      });
      if (!state.contact.fname || !state.contact.email) { alert('Please add your name and email.'); return; }
      submitLead();
      state.step++; render();
    };
  }

  function submitLead() {
    if (!FORMSPREE_ENDPOINT) return;
    var payload = Object.assign({}, state.contact, state.answers, { _subject: 'New CAV Lifestyle Profiler lead' });
    try {
      fetch(FORMSPREE_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(payload)
      });
    } catch (e) {}
  }

  function buildWhatsAppMessage() {
    var a = state.answers;
    var c = state.contact;
    var msg =
      'Hi Custom AV — I have completed the Lifestyle Profiler and would like to book a consultation.\n\n' +
      'Name: ' + c.fname + ' ' + c.lname + '\n' +
      'Location: ' + (c.location || '—') + '\n' +
      'Project: ' + a.project_type + '\n' +
      'Property: ' + a.size + '\n' +
      'Investment: ' + a.budget;
    return encodeURIComponent(msg);
  }

  function generateBrief() {
    var a = state.answers;
    var tierMap = {
      'Estate (15,000+ sqft)': 'Signature',
      'Large villa (8,000–15,000 sqft)': 'Gold · Signature',
      'Villa / townhouse (3,000–8,000 sqft)': 'Silver · Gold',
      'Apartment (under 3,000 sqft)': 'Bronze · Silver'
    };
    var tier = tierMap[a.size] || 'Custom';

    var summary = 'A ' + a.size.toLowerCase() + ' ' +
      (a.project_type.toLowerCase().indexOf('build') > -1 ? 'build' : 'project') +
      ' prioritising ' +
      (a.entertain.toLowerCase().indexOf('rare') > -1 ? 'private living' : 'entertaining') +
      ', ' +
      (a.cinema.toLowerCase().indexOf('essential') > -1 ? 'reference-grade cinema' : 'considered viewing') +
      ', and ' +
      (a.audio.toLowerCase().indexOf('audiophile') > -1 ? 'high-end audio' : 'integrated music') + '.';

    var focus = [];
    if (a.cinema.indexOf('Essential') > -1) focus.push('Dedicated cinema — JVC or Sony 4K laser projection, Stewart Filmscreen, Trinnov immersive audio, Wisdom or PMC reference loudspeakers');
    else if (a.cinema.indexOf('media room') > -1) focus.push('Premium media room — laser projection or large-format display with calibrated surround');
    if (a.audio.indexOf('Audiophile') > -1) focus.push('Reference listening — Wisdom Audio or PMC, Anthem amplification, Trinnov processing, treated room acoustics');
    else if (a.audio.indexOf('Multi-room') > -1) focus.push('Whole-home audio — Paradigm or PMC architectural speakers across zones, Control4 distribution');
    if (a.lighting.indexOf('Architectural') > -1 || a.lighting.indexOf('Designer') > -1) focus.push('Lighting design — Lutron HomeWorks or KNX, scene-driven, integrated at MEP stage');
    if (a.security.indexOf('monitored') > -1 || a.security.indexOf('Robust') > -1) focus.push('Security & access — Ubiquiti UniFi backbone, IP CCTV, integrated access control, monitored response');
    if (a.climate.indexOf('Fully') > -1 || a.climate.indexOf('Motorised') > -1) focus.push('Shading & climate — motorised drapery and shades, integrated HVAC control, sun-tracking automation');
    if (a.entertain.indexOf('Frequent') > -1 || a.entertain.indexOf('Large') > -1) focus.push('Entertaining zones — outdoor audio, scene control for hosting, discreet AV in formal spaces');

    var support =
      a.support.indexOf('Concierge') > -1 ? 'Gold AMC — proactive monitoring, dedicated WhatsApp contact, on-call engineering' :
      a.support.indexOf('Priority') > -1 ? 'Silver AMC — priority response, annual service visits, system health checks' :
      a.support.indexOf('Standard') > -1 ? 'Bronze AMC — reactive support, scheduled service' :
      'Project-based support, no AMC required';

    var watchouts = [];
    if (a.project_type.indexOf('retrofit') > -1 || a.project_type.indexOf('Existing') > -1)
      watchouts.push('Retrofit constraints — cable routing, ceiling access, and rack location require early site survey');
    if (a.project_type.indexOf('Off-plan') > -1)
      watchouts.push('Off-plan timing — MEP coordination with developer is critical before handover');
    if (a.travel.indexOf('away') > -1 || a.travel.indexOf('Frequent') > -1)
      watchouts.push('Remote management — system reliability and remote diagnostics become non-negotiable');

    body.innerHTML =
      '<div class="cav-brief">' +
        '<div class="cav-step-label">Custom AV Lifestyle Brief</div>' +
        '<h2>' + state.contact.fname + ' ' + state.contact.lname + '</h2>' +
        '<p style="font-size:12px;color:#888;letter-spacing:1px;">' + (state.contact.location || 'United Arab Emirates') + '</p>' +
        '<div class="cav-brief-summary">' + summary + '</div>' +
        '<h3>Recommended tier</h3>' +
        '<div>' + tier.split('·').map(function(t) { return '<span class="cav-pill">' + t.trim() + '</span>'; }).join('') + '</div>' +
        '<h3>Indicative investment</h3>' +
        '<p>' + a.budget + '</p>' +
        '<h3>Design focus</h3>' +
        '<ul>' + focus.map(function(f) { return '<li>' + f + '</li>'; }).join('') + '</ul>' +
        '<h3>Long-term support</h3>' +
        '<p>' + support + '</p>' +
        (watchouts.length ? '<h3>Worth flagging early</h3><ul>' + watchouts.map(function(w) { return '<li>' + w + '</li>'; }).join('') + '</ul>' : '') +
        '<div class="cav-cta">' +
          '<h4>Next step — design consultation</h4>' +
          '<p>A 45-minute call with our design team to walk through your brief, MEP coordination, and timeline. No commitment.</p>' +
          '<button class="cav-btn cav-btn-primary" id="book">Book on WhatsApp</button>' +
        '</div>' +
        '<div style="margin-top:20px;display:flex;gap:10px;">' +
          '<button class="cav-btn cav-btn-ghost" id="restart" style="flex:1">Start over</button>' +
          '<button class="cav-btn cav-btn-ghost" id="print" style="flex:1">Print / save PDF</button>' +
        '</div>' +
      '</div>';

    document.getElementById('book').onclick = function() {
      var url = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + buildWhatsAppMessage();
      window.open(url, '_blank');
    };
    document.getElementById('restart').onclick = function() {
      state.step = 0; state.answers = {}; state.contact = {}; render();
    };
    document.getElementById('print').onclick = function() { window.print(); };
  }

  function renderBrief() { generateBrief(); }
  render();
})();
</script>
</body>
</html>
